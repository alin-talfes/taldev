<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALDEV — Descarcă logo-uri SVG</title>
<style>
  :root {
    --bg: #0b1420;
    --panel: #101c2c;
    --panel-2: #142336;
    --border: #223349;
    --text: #e7edf5;
    --muted: #93a4bb;
    --accent1: #00D7E8;
    --accent2: #0A84FF;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #12233a 0%, var(--bg) 55%), var(--bg);
    color: var(--text);
    padding: 32px 16px 80px;
  }
  header {
    max-width: 1080px;
    margin: 0 auto 32px;
    text-align: center;
  }
  header h1 {
    font-size: 28px;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
  }
  .grid {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .preview {
    background:
      linear-gradient(45deg, #182739 25%, transparent 25%),
      linear-gradient(-45deg, #182739 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #182739 75%),
      linear-gradient(-45deg, transparent 75%, #182739 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #0e1926;
    border-radius: 10px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border: 1px solid var(--border);
  }
  .preview img {
    max-width: 100%;
    max-height: 100%;
  }
  .card h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: -10px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .row label {
    font-size: 12px;
    color: var(--muted);
    width: 62px;
    flex-shrink: 0;
  }
  .row input {
    flex: 1;
    background: #0c1826;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    width: 0;
  }
  .row input:focus {
    outline: none;
    border-color: var(--accent2);
  }
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .presets button {
    background: #0c1826;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .presets button:hover {
    border-color: var(--accent2);
    color: var(--text);
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    color: #041018;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { border-color: var(--accent2); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>TALDEV — Logo Kit</h1>
  <p>Descarcă orice variantă ca PNG la rezoluția dorită, sau ca SVG original (vectorial, orice mărime).</p>
</header>

<div class="grid" id="grid"></div>

<footer>Randare 100% locală, în browser — fișierele nu părăsesc acest dispozitiv.</footer>

const grid = document.getElementById('grid');

ITEMS.forEach((item, idx) => {
  const ratio = item.w / item.h;
  const dataUri = 'data:image/svg+xml;base64,' + item.b64;

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="preview">
      <img src="${dataUri}" alt="${item.label}">
    </div>
    <h2>${item.label}</h2>
    <div class="meta">Original: ${item.w}×${item.h}px &middot; ${item.file}</div>
    <div class="row">
      <label>Lățime</label>
      <input type="number" min="1" step="1" value="${Math.round(item.w * 4)}" data-role="width" id="w-${idx}">
      <span style="color:var(--muted);font-size:12px;">px</span>
    </div>
    <div class="row">
      <label>Înălțime</label>
      <input type="number" min="1" step="1" value="${Math.round(item.h * 4)}" data-role="height" id="h-${idx}">
      <span style="color:var(--muted);font-size:12px;">px</span>
    </div>
    <div class="presets" id="presets-${idx}"></div>
    <div class="actions">
      <button class="btn btn-primary" id="png-${idx}">Descarcă PNG</button>
      <button class="btn btn-secondary" id="svg-${idx}">Descarcă SVG</button>
    </div>
  `;

  grid.appendChild(card);

  const wInput = card.querySelector(`#w-${idx}`);
  const hInput = card.querySelector(`#h-${idx}`);
  let lock = false;

  wInput.addEventListener('input', () => {
    if (lock) return;
    lock = true;
    hInput.value = Math.round(parseFloat(wInput.value || 0) / ratio) || '';
    lock = false;
  });
  hInput.addEventListener('input', () => {
    if (lock) return;
    lock = true;
    wInput.value = Math.round(parseFloat(hInput.value || 0) * ratio) || '';
    lock = false;
  });

  // preset resolution buttons
  const presetsDiv = card.querySelector(`#presets-${idx}`);
  const presets = [1, 2, 4, 8];
  presets.forEach(mult => {
    const b = document.createElement('button');
    const pw = Math.round(item.w * mult);
    const ph = Math.round(item.h * mult);
    b.textContent = `${pw}×${ph}`;
    b.addEventListener('click', () => {
      wInput.value = pw;
      hInput.value = ph;
    });
    presetsDiv.appendChild(b);
  });

  // download SVG original
  card.querySelector(`#svg-${idx}`).addEventListener('click', () => {
    const link = document.createElement('a');
    link.href = dataUri;
    link.download = item.file;
    link.click();
  });

  // download PNG at chosen resolution
  card.querySelector(`#png-${idx}`).addEventListener('click', () => {
    const targetW = Math.max(1, parseInt(wInput.value, 10) || Math.round(item.w));
    const targetH = Math.max(1, parseInt(hInput.value, 10) || Math.round(item.h));

    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, targetW, targetH);
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const baseName = item.file.replace(/\.svg$/i, '');
        link.href = url;
        link.download = `${baseName}-${targetW}x${targetH}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }, 'image/png');
    };
    img.src = dataUri;
  });
});
</script>
