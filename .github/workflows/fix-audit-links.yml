name: Fix audited links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-audit-links.yml

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix WhatsApp links
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#https://wa\.me/alin\.talfes#https://wa.me/40770823386#g' index.html sac/index.html
          if grep -R --line-number --fixed-strings 'https://wa.me/alin.talfes' index.html sac/index.html; then
            echo "Old WhatsApp link still present" >&2
            exit 1
          fi

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sac/index.html
          if git diff --cached --quiet; then
            echo "No link changes to commit."
            exit 0
          fi
          git commit -m "Fix WhatsApp links after migration audit"
          git push origin HEAD:main
