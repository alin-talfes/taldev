name: Import taldev-pfa into sac

on:
  push:
    branches:
      - merge-taldev-pfa
    paths:
      - .github/workflows/import-sac.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout taldev migration branch
        uses: actions/checkout@v4
        with:
          ref: merge-taldev-pfa
          path: taldev
          fetch-depth: 0

      - name: Checkout taldev-pfa source
        uses: actions/checkout@v4
        with:
          repository: alin-talfes/taldev-pfa
          ref: main
          path: taldev-pfa
          fetch-depth: 1

      - name: Replace sac with source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf taldev/sac
          mkdir -p taldev/sac
          rsync -a --delete --exclude='.git' taldev-pfa/ taldev/sac/

      - name: Verify S.A.C. syntax
        working-directory: taldev/sac
        run: npm run check

      - name: Run S.A.C. tests
        working-directory: taldev/sac
        run: npm test

      - name: Commit imported snapshot
        working-directory: taldev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sac
          if git diff --cached --quiet; then
            echo "No S.A.C. changes to commit."
            exit 0
          fi
          git commit -m "Import taldev-pfa into sac"
          git push origin HEAD:merge-taldev-pfa
